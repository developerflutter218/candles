        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (firebaseConfig) {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                window.firebaseEnv = { 
                    app, db, auth, 
                    helpers: { signInAnonymously, signInWithCustomToken, onAuthStateChanged, doc, setDoc, onSnapshot },
                    appId: typeof __app_id !== 'undefined' ? __app_id : 'default-app-id'
                };
            }
        } catch (e) {
            console.error("Firebase init failed", e);
        }
    </script>

            Circle: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>,
            Truck: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>,
            Package: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Globe: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>,
            ArrowRight: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            User: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Home: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        };

        // --- CONTEXT ---
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [currentRoute, setCurrentRoute] = useState({ page: 'home', id: null, options: {} });
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [wishlist, setWishlist] = useState([]);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const [lang, setLang] = useState('en');
            const [theme, setTheme] = useState('light');
            const [user, setUser] = useState(null);
            const [isSynced, setIsSynced] = useState(false);

            useEffect(() => {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            }, [lang]);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            // Initialize Firebase Auth
            useEffect(() => {
                if (!window.firebaseEnv) return;
                const { auth, helpers } = window.firebaseEnv;
                
                const initAuth = async () => {
                    try {
                        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        if (token) {
                            await helpers.signInWithCustomToken(auth, token);
                        } else {
                            await helpers.signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Auth error", e);
                    }
                };
                initAuth();

                return helpers.onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) setIsSynced(true);
                });
            }, []);

            // Sync Cart and Wishlist from Firestore
            useEffect(() => {
                if (!user || !window.firebaseEnv) return;
                const { db, helpers, appId } = window.firebaseEnv;
                
                const cartRef = helpers.doc(db, 'artifacts', appId, 'users', user.uid, 'shop', 'cart');
                const cartUnsub = helpers.onSnapshot(cartRef, (doc) => { 
                    if (doc.exists()) setCart(doc.data().items || []); 
                }, (err) => console.error(err));

                const wishRef = helpers.doc(db, 'artifacts', appId, 'users', user.uid, 'shop', 'wishlist');
                const wishUnsub = helpers.onSnapshot(wishRef, (doc) => { 
                    if (doc.exists()) setWishlist(doc.data().items || []); 
                }, (err) => console.error(err));

                return () => { cartUnsub(); wishUnsub(); };
            }, [user]);

            // Database Sync Helpers
            const _updateCart = (newCartOrUpdater) => {
                setCart(prev => {
                    const newCart = typeof newCartOrUpdater === 'function' ? newCartOrUpdater(prev) : newCartOrUpdater;
                    if (user && window.firebaseEnv) {
                        const { db, helpers, appId } = window.firebaseEnv;
                        helpers.setDoc(helpers.doc(db, 'artifacts', appId, 'users', user.uid, 'shop', 'cart'), { items: newCart })
                            .catch(console.error);
                    }
                    return newCart;
                });
            };

            const _updateWishlist = (newWishlistOrUpdater) => {
                setWishlist(prev => {
                    const newWishlist = typeof newWishlistOrUpdater === 'function' ? newWishlistOrUpdater(prev) : newWishlistOrUpdater;
                    if (user && window.firebaseEnv) {
                        const { db, helpers, appId } = window.firebaseEnv;
                        helpers.setDoc(helpers.doc(db, 'artifacts', appId, 'users', user.uid, 'shop', 'wishlist'), { items: newWishlist })
                            .catch(console.error);
                    }
                    return newWishlist;
                });
            };

            useEffect(() => {
                const handleClearCart = () => _updateCart([]);
                window.addEventListener('clear-cart', handleClearCart);
                return () => window.removeEventListener('clear-cart', handleClearCart);
            }, [user]);

            const navigate = (page, id = null, options = {}) => {
                setCurrentRoute({ page, id, options });
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setIsMobileMenuOpen(false);
            };

            const toggleLang = () => setLang(lang === 'en' ? 'ar' : 'en');
            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            const addToCart = (product, quantity = 1) => {
                _updateCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + quantity } : item);
                    }
                    return [...prev, { ...product, quantity }];
                });
                showToast(lang === 'en' ? `Added to bag` : `تمت الإضافة للحقيبة`);
                setIsCartOpen(true);
            };

            const updateCartQuantity = (id, delta) => {
                _updateCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }));
            };

            const removeFromCart = (id) => _updateCart(prev => prev.filter(item => item.id !== id));
            
            const toggleWishlist = (product) => {
                _updateWishlist(prev => {
                    const exists = prev.find(item => item.id === product.id);
                    if (exists) return prev.filter(item => item.id !== product.id);
                    return [...prev, product];
                });
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            // Helpers
            const formatPrice = (price) => {
                if (lang === 'ar') return `${price.toLocaleString('ar-EG')} ج.م`;
                return `EGP ${price.toLocaleString('en-EG')}`;
            };

            return (
                <AppContext.Provider value={{
                    currentRoute, navigate, cart, addToCart, updateCartQuantity, removeFromCart, 
                    isCartOpen, setIsCartOpen, cartTotal, cartCount, wishlist, toggleWishlist,
                    isMobileMenuOpen, setIsMobileMenuOpen, toastMessage, lang, toggleLang, theme, toggleTheme,
                    formatPrice, user, isSynced, t: t[lang]
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        const useAppContext = () => useContext(AppContext);

        // --- SHARED COMPONENTS ---
        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const baseStyle = "inline-flex items-center justify-center px-8 py-3.5 text-sm font-semibold tracking-wide transition-all duration-300 rounded-full active:scale-[0.97]";
            const variants = {
                primary: "bg-brand-charcoal text-brand-ivory hover:bg-brand-terracotta hover:text-white shadow-lg hover:shadow-brand-terracotta/20",
                secondary: "bg-transparent border border-brand-charcoal text-brand-charcoal hover:bg-brand-charcoal hover:text-brand-ivory",
                tertiary: "bg-brand-cream text-brand-charcoal hover:bg-brand-border shadow-sm",
                glass: "bg-white/90 backdrop-blur-md text-black border-none hover:bg-brand-terracotta hover:text-white shadow-lg",
                white: "bg-white text-black hover:bg-brand-terracotta hover:text-white shadow-lg"
            };
            return (
                <button className={`${baseStyle} ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const Toast = () => {
            const { toastMessage } = useAppContext();
            if (!toastMessage) return null;
            return (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 animate-slide-up">
                    <div className="bg-brand-invert text-brand-ivory px-6 py-3 rounded-full text-sm shadow-lg flex items-center gap-2">
                        <span>{toastMessage}</span>
                    </div>
                </div>
            );
        };

        // --- LAYOUT COMPONENTS ---
        const AnnouncementBar = () => {
            const { t } = useAppContext();
            return (
                <div className="bg-brand-cream text-brand-charcoal text-xs font-medium py-2 text-center tracking-wide border-b border-brand-border">
                    {t.announcement}
                </div>
            );
        }

        const Header = () => {
            const { navigate, cartCount, setIsCartOpen, isMobileMenuOpen, setIsMobileMenuOpen, t, lang, toggleLang, theme, toggleTheme, isSynced } = useAppContext();
            const [isScrolled, setIsScrolled] = useState(false);
            const fontClass = lang === 'ar' ? 'font-arabic' : 'font-sans';

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const closeMobileMenu = () => setIsMobileMenuOpen(false);

            return (
                <>
                    <header className={`sticky top-0 z-50 transition-all duration-300 ${fontClass} backdrop-blur-md bg-brand-ivory/90 dark:bg-[#0C0A09]/90 border-b border-brand-border ${isScrolled ? 'py-3 shadow-sm' : 'py-5'}`}>
                        <div className="max-w-7xl mx-auto px-4 md:px-8 flex items-center justify-between">
                            
                            {/* Mobile Menu Toggle - Left */}
                            <div className="flex md:hidden items-center flex-1">
                                <button className="p-2 -ml-2 hover:text-brand-terracotta transition-colors" onClick={() => setIsMobileMenuOpen(true)}>
                                    <Icons.Menu />
                                </button>
                            </div>

                            {/* Desktop Nav - Left */}
                            <nav className="hidden md:flex items-center gap-8 flex-1">
                                <button onClick={() => navigate('shop')} className="text-sm font-medium hover:text-brand-terracotta transition-colors">{t.shop}</button>
                                <button onClick={() => navigate('faq')} className="text-sm font-medium hover:text-brand-terracotta transition-colors">{t.faq}</button>
                                <button onClick={() => navigate('track')} className="text-sm font-medium hover:text-brand-terracotta transition-colors">{t.trackOrder}</button>
                            </nav>

                            {/* Logo - Center */}
                            <div className="flex-1 flex justify-center">
                                <button onClick={() => navigate('home')} className="font-serif text-xl md:text-2xl tracking-[0.2em] text-brand-charcoal text-center leading-[1.1] whitespace-nowrap">
                                    NOUR & OUD
                                </button>
                            </div>

                            {/* Icons - Right */}
                            <div className="flex-1 flex justify-end items-center gap-4 md:gap-5">
                                <button onClick={toggleLang} className="hidden md:flex items-center gap-1.5 p-1 text-sm font-medium hover:text-brand-terracotta transition-colors">
                                    <Icons.Globe /> {lang === 'en' ? 'عربي' : 'EN'}
                                </button>
                                <button onClick={toggleTheme} className="hidden md:block p-1 hover:text-brand-terracotta transition-colors">
                                    {theme === 'light' ? <Icons.Moon /> : <Icons.Sun />}
                                </button>
                                <button className={`hidden md:flex items-center gap-1.5 p-1 text-sm font-medium transition-colors ${isSynced ? 'text-brand-terracotta' : 'hover:text-brand-terracotta'}`} title={isSynced ? t.accountSynced : ''}>
                                    <Icons.User />
                                </button>
                                <button className="relative p-1 hover:text-brand-terracotta transition-colors hidden md:block" onClick={() => setIsCartOpen(true)}>
                                    <Icons.Bag />
                                    {cartCount > 0 && (
                                        <span className="absolute -top-1.5 -right-1.5 bg-brand-terracotta text-white text-[10px] font-bold w-[18px] h-[18px] rounded-full flex items-center justify-center border-2 border-brand-ivory dark:border-[#0C0A09] box-content">
                                            {cartCount}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Mobile Menu Drawer */}
                    {isMobileMenuOpen && (
                        <div className={`fixed inset-0 z-[60] flex`} style={{ justifyContent: lang === 'ar' ? 'flex-end' : 'flex-start' }}>
                            <div 
                                className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity animate-fade-in" 
                                onClick={closeMobileMenu}
                            ></div>
                            
                            <div className={`relative w-4/5 max-w-sm bg-brand-ivory h-full shadow-2xl flex flex-col ${lang === 'ar' ? 'animate-slide-in-right' : 'animate-slide-in-left'} overflow-y-auto ${fontClass}`}>
                                <div className="flex items-center justify-between p-6 border-b border-brand-border">
                                    <span className="font-serif text-xl tracking-[0.15em] whitespace-nowrap">NOUR & OUD</span>
                                    <button onClick={closeMobileMenu} className="p-2 -mr-2 md:mr-0 text-brand-gray hover:text-brand-charcoal transition-colors">
                                        <Icons.X />
                                    </button>
                                </div>

                                <nav className="flex flex-col p-6 gap-6 flex-1">
                                    <button onClick={() => { navigate('home'); closeMobileMenu(); }} className="text-start text-lg font-medium hover:text-brand-terracotta transition-colors">{t.home}</button>
                                    <button onClick={() => { navigate('shop'); closeMobileMenu(); }} className="text-start text-lg font-medium hover:text-brand-terracotta transition-colors">{t.shop}</button>
                                    <button onClick={() => { navigate('faq'); closeMobileMenu(); }} className="text-start text-lg font-medium hover:text-brand-terracotta transition-colors">{t.faq}</button>
                                    <button onClick={() => { navigate('track'); closeMobileMenu(); }} className="text-start text-lg font-medium hover:text-brand-terracotta transition-colors">{t.trackOrder}</button>
                                </nav>
                                
                                <div className="p-6 border-t border-brand-border flex flex-col gap-6">
                                    {isSynced && (
                                        <div className="flex items-center gap-3 text-lg font-medium text-brand-terracotta">
                                            <Icons.User /> {t.accountSynced}
                                        </div>
                                    )}
                                    <button onClick={() => { toggleLang(); closeMobileMenu(); }} className="flex items-center gap-3 text-lg font-medium text-start hover:text-brand-terracotta transition-colors">
                                        <Icons.Globe /> {lang === 'en' ? 'عربي' : 'English'}
                                    </button>
                                    <button onClick={() => { toggleTheme(); closeMobileMenu(); }} className="flex items-center gap-3 text-lg font-medium text-start hover:text-brand-terracotta transition-colors">
                                        {theme === 'light' ? <><Icons.Moon /> Dark Mode</> : <><Icons.Sun /> Light Mode</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const BottomNav = () => {
            const { navigate, currentRoute, isCartOpen, setIsCartOpen, cartCount, t, lang } = useAppContext();
            
            return (
                <div className={`md:hidden fixed bottom-0 left-0 right-0 bg-brand-ivory/95 dark:bg-[#0C0A09]/95 backdrop-blur-xl border-t border-brand-border z-40 flex justify-around items-center h-[72px] pb-[env(safe-area-inset-bottom)] px-2 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] ${lang === 'ar' ? 'font-arabic' : 'font-sans'}`}>
                    <button onClick={() => { setIsCartOpen(false); navigate('home'); }} className={`flex flex-col items-center justify-center w-full h-full space-y-1.5 transition-colors ${currentRoute.page === 'home' && !isCartOpen ? 'text-brand-terracotta' : 'text-brand-gray hover:text-brand-charcoal'}`}>
                        <Icons.Home />
                        <span className="text-[10px] font-medium">{t.home}</span>
                    </button>
                    <button onClick={() => { setIsCartOpen(false); navigate('shop'); }} className={`flex flex-col items-center justify-center w-full h-full space-y-1.5 transition-colors ${currentRoute.page === 'shop' && !isCartOpen ? 'text-brand-terracotta' : 'text-brand-gray hover:text-brand-charcoal'}`}>
                        <Icons.Search />
                        <span className="text-[10px] font-medium">{t.shop}</span>
                    </button>
                    <button onClick={() => setIsCartOpen(true)} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1.5 transition-colors ${isCartOpen ? 'text-brand-terracotta' : 'text-brand-gray hover:text-brand-charcoal'}`}>
                        <div className="relative">
                            <Icons.Bag />
                            {cartCount > 0 && (
                                <span className="absolute -top-1.5 -right-1.5 bg-brand-terracotta text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-brand-ivory dark:border-[#0C0A09] box-content">
                                    {cartCount}
                                </span>
                            )}
                        </div>
                        <span className="text-[10px] font-medium">{t.cart}</span>
                    </button>
                    <button onClick={() => { setIsCartOpen(false); navigate('track'); }} className={`flex flex-col items-center justify-center w-full h-full space-y-1.5 transition-colors ${currentRoute.page === 'track' && !isCartOpen ? 'text-brand-terracotta' : 'text-brand-gray hover:text-brand-charcoal'}`}>
                        <Icons.User />
                        <span className="text-[10px] font-medium">{t.track}</span>
                    </button>
                </div>
            );
        };

        const Footer = () => {
            const { t, lang } = useAppContext();
            const fontClass = lang === 'ar' ? 'font-arabic' : 'font-sans';
            const { navigate } = useAppContext();
            
            return (
                <footer className={`bg-[#F1EAE0] dark:bg-neutral-950 text-neutral-900 dark:text-neutral-200 pt-20 pb-8 px-4 md:px-8 mt-auto ${fontClass}`}>
                    <div className="max-w-7xl mx-auto">
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-16 md:gap-8 mb-20">
                            {/* Brand & Newsletter - Left */}
                            <div className="md:col-span-5 lg:col-span-4 flex flex-col items-start">
                                <h2 className="font-serif text-3xl tracking-widest mb-4">NOUR & OUD</h2>
                                <p className="text-sm opacity-80 mb-8 max-w-xs leading-relaxed">{t.footerTagline}</p>
                                
                                <form className="w-full relative max-w-sm" onSubmit={(e) => e.preventDefault()}>
                                    <input 
                                        type="email" 
                                        placeholder={t.joinNewsletter} 
                                        className="w-full bg-transparent border-b border-neutral-900/30 dark:border-neutral-200/30 py-3 pr-10 text-sm focus:outline-none focus:border-neutral-900 dark:focus:border-neutral-200 transition-colors placeholder:text-neutral-900/50 dark:placeholder:text-neutral-200/50"
                                    />
                                    <button type="submit" className="absolute top-1/2 -translate-y-1/2 right-0 p-2 opacity-60 hover:opacity-100 transition-opacity" style={{ right: lang === 'ar' ? 'auto' : '0', left: lang === 'ar' ? '0' : 'auto' }}>
                                        {lang === 'ar' ? <Icons.ArrowLeft /> : <Icons.ArrowRight />}
                                    </button>
                                </form>
                            </div>

                            {/* Links - Right */}
                            <div className="md:col-span-7 lg:col-span-8 grid grid-cols-1 sm:grid-cols-3 gap-12 sm:gap-8 pt-4 md:pt-0">
                                <div>
                                    <h3 className="font-serif text-lg mb-6">{t.footerShop}</h3>
                                    <ul className="space-y-4 text-sm opacity-80">
                                        <li><button onClick={() => navigate('shop')} className="hover:opacity-70 transition-opacity">{t.allCandles}</button></li>
                                        <li><button onClick={() => navigate('shop', null, { filter: 'bestsellers' })} className="hover:opacity-70 transition-opacity">{t.bestsellers}</button></li>
                                        <li><button onClick={() => navigate('shop', null, { filter: 'gifts' })} className="hover:opacity-70 transition-opacity">{t.gifts}</button></li>
                                    </ul>
                                </div>
                                <div>
                                    <h3 className="font-serif text-lg mb-6">{t.footerAbout}</h3>
                                    <ul className="space-y-4 text-sm opacity-80">
                                        <li><button onClick={() => navigate('story')} className="hover:opacity-70 transition-opacity">{t.ourStory}</button></li>
                                        <li><button onClick={() => navigate('care')} className="hover:opacity-70 transition-opacity">{t.candleCare}</button></li>
                                    </ul>
                                </div>
                                <div>
                                    <h3 className="font-serif text-lg mb-6">{t.customerCare}</h3>
                                    <ul className="space-y-4 text-sm opacity-80 flex flex-col items-start">
                                        <li><button onClick={() => navigate('track')} className="hover:opacity-70 transition-opacity text-start">{t.trackOrder}</button></li>
                                        <li><button onClick={() => navigate('faq')} className="hover:opacity-70 transition-opacity text-start">{t.faq}</button></li>
                                        <li><button onClick={() => navigate('shipping')} className="hover:opacity-70 transition-opacity text-start">{t.shippingInfo}</button></li>
                                        <li><button onClick={() => navigate('returns')} className="hover:opacity-70 transition-opacity text-start">{t.returns}</button></li>
                                        <li><button onClick={() => navigate('contact')} className="hover:opacity-70 transition-opacity text-start">{t.contact}</button></li>
                                        <li><button onClick={() => navigate('privacy')} className="hover:opacity-70 transition-opacity text-start">{t.privacyPolicy}</button></li>
                                        <li><button onClick={() => navigate('terms')} className="hover:opacity-70 transition-opacity text-start">{t.terms}</button></li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        {/* Contact Info */}
                        <div className="border-t border-neutral-900/10 dark:border-neutral-200/10 pt-8 pb-4 mb-4 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm opacity-80">
                            <div>
                                <p className="font-medium mb-1">{lang === 'en' ? 'Address' : 'العنوان'}</p>
                                <p>{t.addressText}</p>
                            </div>
                            <div>
                                <p className="font-medium mb-1">{lang === 'en' ? 'Phone' : 'الهاتف'}</p>
                                <p style={{ direction: 'ltr', textAlign: lang === 'ar' ? 'right' : 'left' }}>{t.phoneText}</p>
                            </div>

                        <div className="w-24 h-24 bg-brand-terracotta/10 text-brand-terracotta rounded-full flex items-center justify-center mx-auto mb-8">
                            <div className="scale-150"><Icons.CheckCircle /></div>
                        </div>
                        <h1 className="font-serif text-4xl md:text-5xl mb-6">{t.orderConfirmed}</h1>
                        <p className="text-lg text-brand-gray mb-10 max-w-lg mx-auto leading-relaxed">
                            {t.orderConfirmedMessage}
                        </p>
                        <div className="bg-brand-cream/50 border border-brand-border rounded-2xl p-6 mb-12 max-w-sm mx-auto backdrop-blur-sm shadow-sm">
                            <p className="text-sm text-brand-gray mb-2 uppercase tracking-widest">{t.orderNumber}</p>
                            <p className="text-3xl font-serif font-medium tracking-wider">{orderNum}</p>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                            <Button onClick={() => navigate('track', orderNum)} variant="secondary" className="h-14 px-8 text-lg">
                                {t.trackYourOrder}
                            </Button>
                            <Button onClick={() => navigate('home')} className="h-14 px-8 text-lg">
                                {t.continueShopping}
                            </Button>
                        </div>
                    </div>
                );
            }

            if (cart.length === 0) {
                return (
                    <div className="py-32 text-center max-w-md mx-auto">
                        <h2 className="font-serif text-3xl mb-6">{t.emptyCart}</h2>
                        <Button onClick={() => navigate('shop')}>{t.exploreCollection}</Button>
                    </div>
                );
            }

            const handleSubmit = (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setTimeout(() => {
                    setOrderNum('ORD-' + Math.floor(100000 + Math.random() * 900000).toString());
                    setIsSuccess(true);
                    window.dispatchEvent(new Event('clear-cart'));
                }, 1000);
            };

            const inputClass = "w-full bg-brand-cream/50 border border-brand-border px-4 py-3 rounded-xl focus:outline-none focus:border-brand-charcoal focus:ring-1 focus:ring-brand-charcoal transition-all";

            return (
                <div className={`max-w-7xl mx-auto px-4 md:px-8 py-16 animate-fade-in ${lang === 'ar' ? 'font-arabic' : 'font-sans'}`}>
                    <h1 className="font-serif text-4xl mb-12 text-center">{t.checkoutTitle}</h1>
                    
                    <div className="flex flex-col lg:flex-row gap-16">
                        <div className="flex-1 order-2 lg:order-1">
                            <form onSubmit={handleSubmit} className="space-y-10">
                                <div>
                                    <h2 className="text-xl font-serif mb-6">{t.contactInfo}</h2>
                                    <input type="email" required placeholder={t.emailPlaceholder} className={inputClass} />
                                </div>
                                
                                <div>
                                    <h2 className="text-xl font-serif mb-6">{t.shippingAddress}</h2>
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <input type="text" required placeholder={t.firstName} className={inputClass} />
                                        <input type="text" required placeholder={t.lastName} className={inputClass} />
                                    </div>
                                    <input type="text" required placeholder={t.address} className={`${inputClass} mb-4`} />
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                        <select required defaultValue="" className={`${inputClass} appearance-none bg-transparent cursor-pointer`}>
                                            <option value="" disabled>{t.governorate}</option>
                                            <option value="cairo">{lang === 'en' ? 'Cairo' : 'القاهرة'}</option>
                                            <option value="giza">{lang === 'en' ? 'Giza' : 'الجيزة'}</option>
                                            <option value="alexandria">{lang === 'en' ? 'Alexandria' : 'الإسكندرية'}</option>
                                            <option value="qalyubia">{lang === 'en' ? 'Al Qalyubia' : 'القليوبية'}</option>
                                        </select>
                                        <input type="text" required placeholder={t.city} className={inputClass} />
                                    </div>
                                    <div className="mb-4">
                                        <input type="text" required placeholder={t.phone} className={inputClass} />
                                    </div>
                                </div>

                                <div className="bg-brand-cream p-6 rounded-2xl border border-brand-border">
                                    <h2 className="text-xl font-serif mb-4 flex items-center gap-2">
                                        <Icons.CheckCircle /> {t.paymentMethod}
                                    </h2>
                                    <div className="flex items-start gap-3 p-4 bg-brand-ivory rounded-xl shadow-sm border border-brand-border">
                                        <input type="radio" checked readOnly className="mt-1 w-4 h-4 text-brand-terracotta focus:ring-brand-terracotta" />
                                        <div>
                                            <p className="font-medium text-brand-charcoal">{t.codTitle}</p>
                                            <p className="text-sm text-brand-gray mt-1">{t.codDesc}</p>
                                        </div>
                                    </div>
                                </div>

                                <Button type="submit" className="w-full h-16 text-lg" disabled={isSubmitting}>
                                    {isSubmitting ? '...' : t.placeOrder}
                                </Button>
                            </form>
                        </div>

                        <div className="w-full lg:w-[450px] shrink-0 order-1 lg:order-2">
                            <div className="bg-brand-cream/30 p-8 rounded-3xl sticky top-32 border border-brand-border">
                                <h2 className="font-serif text-2xl mb-6">{t.orderSummary}</h2>
                                <ul className="space-y-6 mb-8">
                                    {cart.map(item => (
                                        <li key={item.id} className="flex gap-4">
                                            <div className="w-20 h-20 bg-brand-cream rounded-xl relative overflow-hidden shadow-sm">
                                                <img src={item.image} className="w-full h-full object-cover" alt="" />
                                                <span className="absolute top-1 right-1 bg-brand-charcoal text-white w-5 h-5 flex items-center justify-center rounded-full text-xs font-sans">
                                                    {item.quantity}
                                                </span>
                                            </div>
                                            <div className="flex-1 py-1 flex flex-col justify-center">
                                                <h3 className="font-medium text-sm">{item.name[lang]}</h3>
                                                <p className="text-sm font-medium mt-2">{formatPrice(item.price * item.quantity)}</p>
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                                <div className="border-t border-brand-border pt-6 space-y-3 text-sm mb-6">
                                    <div className="flex justify-between">
                                        <span className="text-brand-gray">{t.subtotal}</span>
                                        <span className="font-medium">{formatPrice(cartTotal)}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-brand-gray">{t.shipping}</span>
                                        <span>{t.calculatedNext}</span>
                                    </div>
                                </div>
                                <div className="border-t border-brand-border pt-6 flex justify-between font-serif text-2xl">
                                    <span>{t.total}</span>
                                    <span className="text-brand-terracotta">{formatPrice(cartTotal)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TrackOrderPage = () => {
            const { t, lang, currentRoute } = useAppContext();
            const fontClass = lang === 'ar' ? 'font-arabic' : 'font-sans';
            const [orderId, setOrderId] = useState(currentRoute.id || '');
            const [tracked, setTracked] = useState(!!currentRoute.id);

            const handleTrack = (e) => {
                e.preventDefault();
                if (orderId.trim()) setTracked(true);
            };

            const steps = [
                { title: t.orderPlaced, done: true, pendingIcon: <Icons.Circle /> },
                { title: t.orderConfirmed, done: true, pendingIcon: <Icons.Circle /> },
                { title: t.outForDelivery, done: false, pendingIcon: <Icons.Truck /> },
                { title: t.delivered, done: false, pendingIcon: <Icons.Package /> }
            ];

            return (
                <div className={`max-w-3xl mx-auto px-4 md:px-8 py-24 animate-fade-in ${fontClass}`}>
                    <h1 className="font-serif text-4xl md:text-5xl mb-6 text-center">{t.trackOrder}</h1>
                    <p className="text-center text-brand-gray mb-12 max-w-md mx-auto text-lg">{t.trackOrderDesc}</p>
                    
                    <form onSubmit={handleTrack} className="flex flex-col sm:flex-row gap-4 max-w-md mx-auto mb-16">
                        <input 
                            type="text" 
                            placeholder={t.orderNumber} 
                            value={orderId} 
                            onChange={(e) => { setOrderId(e.target.value); setTracked(false); }}
                            className="flex-1 bg-brand-cream/50 border border-brand-border px-4 py-3 rounded-xl focus:outline-none focus:border-brand-charcoal focus:ring-1 focus:ring-brand-charcoal transition-all text-center sm:text-start"
                            required
                        />
                        <Button type="submit" className="h-12 px-8 sm:w-auto">{t.track}</Button>
                    </form>

                    {tracked && orderId && (
                        <div className="bg-brand-card p-6 md:p-10 rounded-[2rem] border border-brand-border/60 shadow-xl shadow-brand-charcoal/5 max-w-lg mx-auto animate-slide-up">
                            <h3 className="font-serif text-xl mb-8 border-b border-brand-border/60 pb-4 text-center">
                                {t.orderStatus}: <span className="font-sans font-medium text-brand-terracotta">{orderId}</span>
                            </h3>
                            <div className="flex flex-col gap-8">
                                {steps.map((step, idx) => (
                                    <div key={idx} className="flex items-center gap-6 relative">
                                        {/* Connecting Line */}
                                        {idx !== steps.length - 1 && (
                                            <div className={`absolute top-10 bottom-[-2rem] w-0.5 ${step.done ? 'bg-brand-terracotta' : 'bg-brand-border'} ${lang === 'ar' ? 'right-[1.125rem]' : 'left-[1.125rem]'}`}></div>
                                        )}
                                        
                                        <div className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center border-2 z-10 transition-colors duration-500 ${step.done ? 'bg-brand-terracotta border-brand-terracotta text-white' : 'bg-brand-card border-brand-border text-brand-gray'}`}>
                                            <div className={step.done ? "scale-100" : "scale-75"}>
                                                {step.done ? <Icons.CheckCircle /> : step.pendingIcon}
                                            </div>
                                        </div>
                                        <div className="flex-1 pt-1">
                                            <p className={`text-lg transition-colors duration-500 ${step.done ? 'font-medium text-brand-charcoal' : 'text-brand-gray'}`}>{step.title}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StoryPage = () => {
            const { t, lang } = useAppContext();
            const fontClass = lang === 'ar' ? 'font-arabic' : 'font-sans';
            
            return (
                <div className={`max-w-7xl mx-auto px-4 md:px-8 py-24 animate-fade-in ${fontClass}`}>
                    <div className="flex flex-col md:flex-row items-center gap-16 lg:gap-24">
                        <div className="flex-1 w-full order-2 md:order-1">
                            <div className="aspect-[4/5] rounded-[2rem] overflow-hidden shadow-xl border border-brand-border/50">
                                <img 
                                    src="https://images.unsplash.com/photo-1589363460779-cb71b802613d?q=80&w=1200&auto=format&fit=crop" 
                                    alt="Craftsmanship" 
                                    className="w-full h-full object-cover" 
                                />
                            </div>
                        </div>
                        <div className="flex-1 max-w-xl order-1 md:order-2">
                            <h1 className="font-serif text-4xl md:text-5xl lg:text-6xl mb-8 leading-tight text-brand-charcoal">
                                {t.ourStory}
                            </h1>
                            <p className="text-lg text-brand-gray mb-6 leading-relaxed">
                                {t.madeSlowlyDesc}
                            </p>
                            <p className="text-lg text-brand-gray leading-relaxed">
                                {lang === 'ar' ? 'نحن نؤمن بأن أصغر الطقوس يمكن أن تحدث أكبر فرق. تم تصميم مجموعاتنا بعناية لتجلب الدفء والهدوء إلى كل زاوية من زوايا منزلك.' : 'We believe the smallest rituals can make the biggest difference. Our collections are thoughtfully designed to bring warmth and calm into every corner of your home.'}
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP ROOT ---
        const App = () => {
            const { currentRoute, t, lang } = useAppContext();

            const renderPage = () => {
                const getMockContent = () => (
                    <>
                        <p className="mb-6 opacity-80">
                            {lang === 'ar' 
                                ? `هذا محتوى تجريبي لصفحة ${currentRoute.page}. سيتم تحديثه بالمحتوى الفعلي قريباً.` 
                                : `This is placeholder content for the ${currentRoute.page} page. It will be updated with actual content soon.`}
                        </p>
                        <p className="opacity-80">
                            {lang === 'ar'
                                ? "شكراً لزيارتك نور وعود. نحن ملتزمون بتقديم أفضل تجربة ممكنة لك."
                                : "Thank you for visiting Nour & Oud. We are dedicated to providing you with the best experience possible."}
                        </p>
                    </>
                );

                switch (currentRoute.page) {
                    case 'home': return <HomePage />;
                    case 'shop': return <ShopPage />;
                    case 'product': return <ProductDetailsPage productId={currentRoute.id} />;
                    case 'checkout': return <CheckoutPage />;
                    case 'track': return <TrackOrderPage />;
                    case 'story': return <StoryPage />;
                    case 'care': return <EditorialPage title={t.candleCare} content={getMockContent()} />;
                    case 'faq': return <FaqPage />;
                    case 'shipping': return <EditorialPage title={t.shippingInfo} content={getMockContent()} />;
                    case 'returns': return <EditorialPage title={t.returns} content={getMockContent()} />;
                    case 'contact': return <ContactPage />;
                    case 'privacy': return <EditorialPage title={t.privacyPolicy} content={getMockContent()} />;
                    case 'terms': return <EditorialPage title={t.terms} content={getMockContent()} />;
                    default: return <HomePage />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col selection:bg-brand-terracotta selection:text-white">
                    <AnnouncementBar />
                    <Header />
                    <main className="flex-1 pb-[72px] md:pb-0">
                        {renderPage()}
                    </main>
                    <Footer />
                    <BottomNav />
                    <CartDrawer />
                    <Toast />
                </div>
            );
        };

        const Root = () => (
            <AppProvider>
                <App />
            </AppProvider>
        );

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<Root />);
    </script>
</body>
</html>
